name = "discretization"
defaultTargets = ["Discretization", "BasicResults"]

# All Lake dependencies live in one folder outside the repository, shared with the other
# projects of this workspace that pin the same toolchain, so a single built Mathlib serves
# all of them. The folder is named after the version it holds, which lets several Mathlib
# versions coexist. A fresh clone creates `lake-packages/v4.33.1` next to this folder.
packagesDir = "../lake-packages/v4.33.1"

# Mathlib pinned to the v4.33.1 tag, matching lean-toolchain: a release tag has a
# fully-published build cache, so `lake exe cache get` finds every olean.
[[require]]
name = "mathlib"
scope = "leanprover-community"
version = "git#v4.33.1"

# The general matrix and integration facts the theory consumes: the Loewner order, trace
# inequalities, the Sherman-Morrison formula, and the bridge between integrals of quadratic
# forms and Gram matrices. Nothing here mentions discretization.
[[lean_lib]]
name = "BasicResults"

[[lean_lib]]
name = "Discretization"
