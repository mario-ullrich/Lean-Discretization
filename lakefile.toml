name = "discretization"
defaultTargets = ["Discretization", "BasicResults"]

# Mathlib pinned to the v4.33.1 tag, matching lean-toolchain: a release tag has a
# fully-published build cache, so `lake exe cache get` finds every olean.
[[require]]
name = "mathlib"
scope = "leanprover-community"
version = "git#v4.33.1"

# Supplies `lake exe checkdecls`, which the blueprint build runs to verify that every
# `\lean{Decl}` tag names a declaration that really exists in the compiled project.
[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"

# The general matrix and integration facts the theory consumes: the Loewner order, trace
# inequalities, the Sherman–Morrison formula, and the bridge between integrals of quadratic
# forms and Gram matrices. Nothing here mentions discretization.
[[lean_lib]]
name = "BasicResults"

[[lean_lib]]
name = "Discretization"

# Submission surfaces for the Palomar registry, one directory per registered result.
# Kept out of `defaultTargets` on purpose: a plain `lake build` then behaves exactly as
# before and never compiles the Challenge modules, whose `sorry` placeholders are required
# by the submission format. Build them explicitly with `lake build Palomar`.
#
# The globs make every module under `Palomar/` its own root. A Challenge and its Solution
# must not meet in one environment: the Challenge repeats the definitions that the Solution
# gets from `Discretization`, so importing both would declare them twice, and Comparator
# likewise compiles the two separately.
#
# `Palomar` is listed alongside `Palomar.+` because the `.+` form builds the submodules
# only, while `leanblueprint checkdecls` imports the root module of every `lean_lib`. The
# root imports nothing, so loading it alongside the other libraries stays harmless.
[[lean_lib]]
name = "Palomar"
globs = ["Palomar", "Palomar.+"]
