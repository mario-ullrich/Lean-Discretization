fidelity:
  divergences: >-
    The source states (1 − √(m/n)) ‖f‖_∞ ≤ √m ((1/n) ∑ᵢ |f(xᵢ)|²)^{1/2}, without ε and
    with the factor 1/(2m) in place of 1 − √(m/n) for n = m. The formalization keeps the
    m + ε of the Kiefer–Wolfowitz measure on an arbitrary set and the 1 − √((m−1)/n) of
    the source's proof, and states the bound for squared values. Since
    1 − √((m−1)/n) > max(1 − √(m/n), 1/(2m)) strictly, a small enough ε gives the bound
    of the source for every n ≥ m; on a compact domain ε = 0 is formalized directly.

    The bound by the largest sample value is stated for every n ≥ m, where the source
    displays it for n = 2m; the maximum is written as the supremum ⨆ i over the n
    points. The source takes a space V_m of dimension m; the formalization takes m
    bounded functions whose linear independence is stated as "⟨c, a(y)⟩ = 0 for every y
    only for c = 0", writes the functions of the span as f(y) = ⟨c, a(y)⟩, bounds the
    functions by one constant C, and takes complex scalars.

review:
  status: "self-assessed"
  reviewers:
    - "none"
  notes: >-
    The statements of all definitions and results were checked and revised by the
    author; the proof scripts were largely produced with AI assistance and rest on
    the Lean kernel.

alignment:
  namespace: "Discretization"
  statements:
    - source: "Constructive discretization and approximation in RKHS, Proposition 8, p = ∞"
      lean: "Discretization.exists_uniform_discretization_by_l2"
      module: "Discretization.UniformDiscretization"
      status: "proved"
      note: >-
        The uniform norm by the discrete ℓ₂ norm of n ≥ m sample values on an arbitrary
        set, with the constant (m + ε) / (1 − √((m−1)/n))²; see fidelity.divergences.
    - source: "Constructive discretization and approximation in RKHS, Proposition 8, p = ∞, compact domain"
      lean: "Discretization.exists_uniform_discretization_of_compact_by_l2"
      module: "Discretization.UniformDiscretization"
      status: "proved"
      note: >-
        The same for continuous functions on a compact domain, with ε = 0.
    - source: "Constructive discretization and approximation in RKHS, Proposition 8, p = ∞, by the largest sample value"
      lean: "Discretization.exists_uniform_discretization_by_max"
      module: "Discretization.UniformDiscretization"
      status: "proved"
      note: >-
        The uniform norm by the largest of n ≥ m sample values; for n = 2m it is the
        bound ‖f‖_∞ ≤ (2 + √2) √(m + ε) maxᵢ |f(xᵢ)| that the source states with √m.
    - source: "Constructive discretization and approximation in RKHS, Proposition 8, p = ∞, by the largest sample value, compact domain"
      lean: "Discretization.exists_uniform_discretization_of_compact_by_max"
      module: "Discretization.UniformDiscretization"
      status: "proved"
      note: >-
        The same for continuous functions on a compact domain, with ε = 0.

