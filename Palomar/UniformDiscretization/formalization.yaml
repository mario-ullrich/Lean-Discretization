# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4
version: "v0.4"

project:
  name: "Discretization of the uniform norm with n ≥ m points"
  description: >-
    On an m-dimensional space V of bounded functions on an arbitrary set Ω, for every
    ε > 0 and every n ≥ m, there are points x₁, …, xₙ ∈ Ω, not necessarily distinct, with
    |f(y)|² ≤ (m + ε) / (1 − √((m−1)/n))² · (1/n) ∑ᵢ |f(xᵢ)|² for every y ∈ Ω and every
    f ∈ V: the uniform norm is dominated by the discrete ℓ₂ norm of n sample values. An
    average is at most its largest term, so the same points give
    |f(y)|² ≤ (m + ε) / (1 − √((m−1)/n))² · maxᵢ |f(xᵢ)|². For continuous functions on a
    compact domain both hold with ε = 0. For n = 2m the first bound is
    ‖f‖_∞ ≤ (1 + √2) √(1 + ε/m) (∑ᵢ |f(xᵢ)|²)^{1/2}, where Krieg, Pozharska, Ullrich and
    Ullrich have the constant 42, and the second is
    ‖f‖_∞ ≤ (2 + √2) √(m + ε) maxᵢ |f(xᵢ)|. The points are obtained by thinning the
    measure of the Kiefer–Wolfowitz theorem with a one-sided discretization of the L₂
    norm with equal weights.
  authors:
    - "Mario Ullrich"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Mario Ullrich"

classification:
  arxiv: ["math.NA", "math.FA"]
  msc2020: ["41A17", "46E15", "62K05"]

sources:
  - title: "Constructive discretization and approximation in reproducing kernel Hilbert spaces"
    authors:
      - "Abdellah Chkifa"
      - "Matthieu Dolbeault"
      - "David Krieg"
      - "Mario Ullrich"
    id: "arXiv:2602.18719"
    type: "paper"
    location: "https://arxiv.org/abs/2602.18719"
    relationship: "formalizes"
    note: >-
      Proposition 8 for p = ∞ is the statement formalized here, together with the bound
      by the largest sample value that the paper derives from it for n = 2m; its proof,
      the Kiefer–Wolfowitz measure thinned by the one-sided discretization with weights
      1/n, is the one followed. The case p = 2 is the separate OneSidedDiscretization
      submission of this repository.
    author_endorsement: "participated"
  - title: "Sampling projections in the uniform norm"
    authors:
      - "David Krieg"
      - "Kateryna Pozharska"
      - "Mario Ullrich"
      - "Tino Ullrich"
    id: "arXiv:2401.02220"
    type: "paper"
    location: "https://doi.org/10.1016/j.jmaa.2025.129873"
    relationship: "background"
    note: >-
      J. Math. Anal. Appl. 553 (2026), no. 2, Paper No. 129873. Theorem 2 bounds the
      uniform norm by 2m sample values, ‖f‖_∞ ≤ 42 (∑ᵢ |f(xᵢ)|²)^{1/2}, read there also
      as ‖f‖_∞ ≤ c √m maxᵢ |f(xᵢ)| with c = 42√2. Proposition 9, the Kiefer–Wolfowitz
      theorem on an arbitrary set, is the measure the proof starts from; it is the
      separate KieferWolfowitz submission of this repository.
    author_endorsement: "participated"
  - title: "Deterministic and stochastic error bounds in numerical analysis"
    authors:
      - "Erich Novak"
    type: "book"
    location: "Lecture Notes in Mathematics 1349, Springer-Verlag, Berlin, 1988"
    relationship: "background"
    note: >-
      Lemma 1.2.2, a form of Auerbach's lemma with function values, bounds the uniform
      norm by the largest of n = m sample values, ‖f‖_∞ ≤ (m + ε) maxᵢ |f(xᵢ)|.
  - title: "The equivalence of two extremum problems"
    authors:
      - "Jack Kiefer"
      - "Jacob Wolfowitz"
    type: "paper"
    location: "https://doi.org/10.4153/CJM-1960-030-4"
    relationship: "background"
    note: >-
      Canad. J. Math. 12 (1960), 363–366. The equivalence theorem for optimal designs,
      the source of the measure that is thinned here.

related_formalizations: []

status:
  scope: >-
    Formalized and advertised: Discretization.exists_uniform_discretization_by_l2 and
    Discretization.exists_uniform_discretization_by_max, the bounds by the discrete ℓ₂
    norm and by the largest of n ≥ m sample values on an arbitrary set, and
    Discretization.exists_uniform_discretization_of_compact_by_l2 and
    Discretization.exists_uniform_discretization_of_compact_by_max, the same with ε = 0
    for continuous functions on a compact domain.

    Proved in the repository but not advertised here: the thinning of any design with
    positive definite Gram matrix to n ≥ m of its points with equal weights
    (Discretization.exists_sparse_design_equal_weights) and the resulting bound for any
    design (Discretization.exists_uniform_discretization_of_design_by_l2); the real
    inequalities that combine them (Discretization.le_div_sq_mul_of_le_mul,
    Discretization.inv_mul_sum_le_iSup).
