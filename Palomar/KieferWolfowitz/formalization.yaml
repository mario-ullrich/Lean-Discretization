    relationship: "background"
    note: >-
      Canad. J. Math. 12 (1960), 363-366. The original equivalence theorem for
      optimal designs, of which the advertised bound is the half used here.

related_formalizations: []

status:
  scope: >-
    Formalized and advertised:
    Discretization.KieferWolfowitz.exists_design_kieferWolfowitz_card_le, the bound
    with the constant n + epsilon on an arbitrary set, and
    Discretization.KieferWolfowitz.exists_design_kieferWolfowitz_of_compact_card_le,
    the sharp constant n for continuous functions on a compact domain. Both give a
    design of at most 2n^2 + 1 points whose Gram matrix is positive definite.

    Proved in the repository but not advertised here: the same two theorems without
    the bound on the number of points (exists_design_kieferWolfowitz,
    exists_design_kieferWolfowitz_of_compact); the statement for the measure
    rho = sum_k w_k delta(x_k) itself
    (exists_probabilityMeasure_kieferWolfowitz), together with the identity
    gram a rho = designGram a x w that hands it to the sparsification theorem; the
    reduction of any design to one with at most 2n^2 + 1 points and the same Gram
    matrix (exists_design_card_le), by Caratheodory's theorem; and John's
    decomposition of the identity over the design points
    (sum_weight_quadForm_inv_eq_card, sum_weight_smul_quadForm_inv_eq_self).

    Not formalized: the sampling projections the source builds from this theorem.
