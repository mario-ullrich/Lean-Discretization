# formalization.yaml v0.4
version: "v0.4"

project:
  name: "The theorem of Kiefer and Wolfowitz for sampling projections"
  description: >-
    On an n-dimensional space V of bounded functions on an arbitrary set D, and for
    every epsilon > 0, there is a finitely supported probability measure
    rho = sum_k w_k delta(x_k) for which the uniform norm on V is dominated by the
    L_2(rho) norm with the constant sqrt(n + epsilon):
    |f(y)|^2 <= (n + epsilon) * sum_k w_k |f(x_k)|^2 for every y in D and every f in V.
    For continuous functions on a compact domain the loss disappears and the constant
    is the sharp sqrt(n). In both cases at most 2n^2 + 1 points are needed. The measure
    is one whose Gram matrix has an almost maximal determinant; applying a
    sparsification theorem to such a measure is how one arrives at sampling projections
    with few points and small norm.
  authors:
    - "Mario Ullrich"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Mario Ullrich"

classification:
