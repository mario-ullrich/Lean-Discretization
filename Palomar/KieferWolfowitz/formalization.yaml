# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4
version: "v0.4"

project:
  name: "The Kiefer–Wolfowitz theorem"
  description: >-
    On an m-dimensional space V of bounded functions on an arbitrary set Ω, and for
    every ε > 0, there is a finitely supported probability measure ϱ = ∑ₖ wₖ δ(xₖ) for
    which the uniform norm on V is dominated by the L₂(ϱ) norm with the constant
    √(m + ε): |f(y)|² ≤ (m + ε) ∑ₖ wₖ |f(xₖ)|² for every y ∈ Ω and every f ∈ V.
    For continuous functions on a compact domain the same holds with ε = 0. In both
    cases at most m² + 1 points are needed. The measure is one whose Gram matrix has an
    almost maximal determinant.
  authors:
    - "Mario Ullrich"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Mario Ullrich"

classification:
  arxiv: ["math.NA", "math.ST"]
  msc2020: ["62K05", "41A17", "15A15"]

sources:
  - title: "Sampling projections in the uniform norm"
    authors:
      - "David Krieg"
      - "Kateryna Pozharska"
      - "Mario Ullrich"
      - "Tino Ullrich"
    id: "arXiv:2401.02220"
    type: "paper"
    location: "https://doi.org/10.1016/j.jmaa.2025.129873"
    relationship: "formalizes"
    note: >-
      J. Math. Anal. Appl. 553 (2026), no. 2, Paper No. 129873. Proposition 9, with its
      compact case, is the statement formalized here. The proof follows the paper with a
      near-maximiser of the Gram determinant over designs in place of a maximiser in the
      closure of their Gram matrices.
    author_endorsement: "participated"
  - title: "The equivalence of two extremum problems"
    authors:
      - "Jack Kiefer"
      - "Jacob Wolfowitz"
    type: "paper"
    location: "https://doi.org/10.4153/CJM-1960-030-4"
    relationship: "background"
    note: >-
      Canad. J. Math. 12 (1960), 363–366. The original equivalence theorem for
      optimal designs, of which the advertised bound is the half used here.

related_formalizations: []

status:
  scope: >-
    Formalized and advertised:
    Discretization.KieferWolfowitz.exists_optimal_design_card_le, the bound
    with the constant m + ε on an arbitrary set, and
    Discretization.KieferWolfowitz.exists_optimal_design_of_compact_card_le,
    the same with ε = 0 for continuous functions on a compact domain. Both give a
    design of at most m² + 1 points whose Gram matrix is positive definite.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models:
        - "Claude Opus 5 (Anthropic)"
        - "Claude Fable 5.1 (Anthropic)"
      framework: "Claude Code"
      tool_setup: >-
        VS Code with the Lean 4 extension, and Claude Code driving an agentic loop
        that edits Lean files and runs `lake build` until the affected files compile.
        No proof search beyond the tactics of Lean and Mathlib.
      cost:
        wall_time: "not tracked"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: >-
        Standing instructions for this discretization project, kept in a CLAUDE.md
        file alongside the project and outside this repository, and applied to every
        session: prefer many small, self-contained, reusable lemmas over long proofs;
        search Mathlib first and reuse existing lemmas and canonical spellings;
        rebuild the affected files after every change and never leave a `sorry`
        unannounced.
  spend_usd: "subscription-based"
  notes: >-
    Most of the Lean proofs were produced with AI assistance. Throughout, the author
    designed the structure of the development and checked and revised the statements
    of all definitions and results. The proofs themselves are guaranteed by the Lean
    kernel.

fidelity:
  divergences: >-
    Proposition 9 bounds the number of points by dim span{f ḡ : f, g ∈ V} + 1, which is
    at most m² + 1 and smaller for particular spaces; the formalization states m² + 1.

review:
  status: "self-assessed"
  reviewers:
    - "none"
  notes: >-
    The statements of all definitions and results were checked and revised by the
    author; the proof scripts were largely produced with AI assistance and rest on
    the Lean kernel.

alignment:
  namespace: "Discretization.KieferWolfowitz"
  statements:
    - source: "Sampling projections in the uniform norm, Proposition 9"
      lean: "Discretization.KieferWolfowitz.exists_optimal_design_card_le"
      module: "Discretization.KieferWolfowitz.PointCount"
      status: "proved"
      note: "The bound with the constant m + ε on an arbitrary set, with at most m² + 1 points."
    - source: "Sampling projections in the uniform norm, Proposition 9, compact case"
      lean: "Discretization.KieferWolfowitz.exists_optimal_design_of_compact_card_le"
      module: "Discretization.KieferWolfowitz.PointCount"
      status: "proved"
      note: "The same with ε = 0 for continuous functions on a compact domain."

acknowledgements: >-
  Built on Mathlib. The Challenge module reproduces the definition
  Discretization.KieferWolfowitz.designGram from the development in
  Discretization/KieferWolfowitz/Design.lean, so that the advertised statements can be
  read against Mathlib alone.
