fidelity:
  divergences: >-
    Linear independence of the functions is stated as the separating condition
    "for every coefficient vector c, if <c, a(y)> vanishes for every y then c = 0",
    which the development identifies with LinearIndependent over the complex numbers
    (linearIndependent_iff_forall_star). Boundedness is stated as one constant C bounding
    every value |a_i(y)|.

    The design is given as points x_1, ..., x_N with weights w_1, ..., w_N rather
    than as a measure. The measure form is proved in the repository as
    exists_probabilityMeasure_kieferWolfowitz, with the identity relating its Gram
    matrix to the Gram matrix of the points and weights.

    On a general domain the proof does not use a maximiser. Instead of maximising the
    determinant over the compact convex hull of the rank-one matrices, it takes a
    near-maximiser of the supremum of the determinants; the perturbation is computed
    exactly by the matrix determinant lemma, and the first-order condition is replaced
    by Bernoulli's inequality with the explicit weight alpha = (t-n)/(2n(t-1)). This
    avoids both a Jacobi formula and the compactness of a convex hull, neither of
    which Mathlib has. On a compact domain the maximum is attained and the same
    computation gives the sharp constant.

