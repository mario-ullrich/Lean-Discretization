# formalization.yaml v0.4
version: "v0.4"

project:
  name: "A generalized sparsification theorem of Batson, Spielman and Srivastava type"
  description: >-
    Given two families of square-integrable functions on a measure space, a finite
    one a = (aₖ) with m elements and a second one b, one can select n points and
    positive weights, for every n ≥ m, so that the first family stays a frame from
    below and the second stays a frame from above, with the constants
    (1 − √((m−1)/n))² and (1 + √((M−1)/n))² Λ. Here Λ bounds the Gram matrix J of the
    second family and M = Tr J / Λ is its effective dimension. What the number of
    points depends on is M, not the number of functions in the second family, which
    is what makes the theorem applicable to infinite families and to reproducing
    kernel Hilbert spaces, and why its constants beat those obtainable from the
    theorem of Kadison and Singer. For a = b with both Gram matrices the identity,
    M equals m and the statement is the sparsification theorem of Batson, Spielman
    and Srivastava with m − 1 in place of m. Formalized in two forms, as an inequality
    between matrices in the Loewner order and as a discretization inequality for the
    L₂ norm, and each for a finite second family and for a square-integrable map into
    a separable Hilbert space. There is no side condition beyond n ≥ m.
  authors:
    - "Mario Ullrich"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Mario Ullrich"

classification:
  arxiv: ["math.NA", "math.FA"]
  msc2020: ["41A17", "42C15", "15A45", "46E22"]

sources:
  - title: "Constructive discretization and approximation in reproducing kernel Hilbert spaces"
    authors:
      - "Abdellah Chkifa"
      - "Matthieu Dolbeault"
      - "David Krieg"
      - "Mario Ullrich"
    id: "arXiv:2602.18719"
    type: "preprint"
    location: "https://arxiv.org/abs/2602.18719"
    relationship: "formalizes"
    note: >-
      Theorem 3 is the sparsification theorem formalized here and Corollary 4 the
      discretization inequality; its proof is the one followed. The source states
      Theorem 3 for an at most countable second index set, and both cases are
      formalized: a finite one with a Gram matrix, and an infinite one with the Gram
      operator of a map into a separable Hilbert space. The discretization inequality
      for the norm of a reproducing kernel Hilbert space is proved as well; the
      applications to least-squares recovery and sampling numbers are not formalized.
    author_endorsement: "participated"
  - title: "Twice-Ramanujan sparsifiers"
    authors:
      - "Joshua Batson"
      - "Daniel A. Spielman"
      - "Nikhil Srivastava"
    id: "arXiv:0808.0163"
    type: "article"
    location: "https://doi.org/10.1137/130949117"
    relationship: "background"
    note: >-
      SIAM Review 56 (2014), no. 2, 315–334. The original potential-function
      argument, which is the case a = b with both Gram matrices the identity and
      M = m, with the constants (1 ∓ √(m/n))².

related_formalizations: []

status:
  scope: >-
    Formalized and advertised: Discretization.bss_generalized and
    Discretization.Infinite.bss_generalized, the frame bounds for a finite and for an
    infinite second family, together with the discretization inequalities
    Discretization.exists_discretization and
    Discretization.Infinite.exists_discretization. None of the four carries a side
    condition beyond n ≥ m.

    Proved in the repository but not advertised here: the same two statements in the
    literal form of the source, for a countable family (bₖ) with its Gram matrix
    (Discretization.Countable.bss_generalized, Discretization.Countable.exists_discretization),
    deduced from the Hilbert-space form on ℓ²; the discretization inequality for the
    norm of a reproducing kernel Hilbert space, with the kernel sections K(x, ·) as
    second family (Discretization.RKHS.exists_discretization); and the forms along a
    given Hilbert basis (Discretization.Infinite.bss_generalized_of_hilbertBasis,
    Discretization.Infinite.exists_discretization_of_hilbertBasis).

    Proved in the repository but not advertised here: the potential argument under
    the two side conditions m ≥ 2 and M ≥ 1 + 1/n
    (bss_generalized_of_gram_eq_one), the three edge cases that remove them
    (bss_generalized_of_unique, bss_generalized_of_small_dim,
    bss_generalized_of_unique_of_small_dim), each proved once for a finite and a
    countable second family (Discretization.UpperBarrier).

    Not formalized: sampling projections in the uniform norm; least-squares recovery
    and sampling numbers.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

