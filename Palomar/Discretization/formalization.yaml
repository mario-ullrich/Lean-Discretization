fidelity:
  divergences: >-
    The lower frame bound of the source is stated with the factor λ_min(I) for the
    Gram matrix I of the first family; the formalization states the equivalent
    Loewner inequality (1 − √((m−1)/n))² I ≼ ∑ᵢ wᵢ a(xᵢ) a(xᵢ)*, from which the
    eigenvalue form follows.

    Traces of the matrices involved are real, and the formalization takes real parts
    explicitly with RCLike.re wherever a real number is needed.

    For an infinite second family the source works with a family (bₖ) indexed by a
    countable set. The advertised form takes a single square-integrable map b into a
    nonzero separable Hilbert space H with its Gram operator J = ∫ b(x) b(x)* dμ(x),
    a Bochner integral of rank-one operators; a family (bₖ) is the case H = ℓ², and
    that form is proved as well (Discretization.Countable.bss_generalized).
    Positivity of J and the finiteness of its trace follow from its definition, and
    the effective dimension is M = ∫ ‖b‖² dμ / Λ, which equals the trace of J along
    any Hilbert basis. Positive definiteness of the Gram matrix
    is replaced by injectivity of J, which is the correct hypothesis in infinite
    dimension because a positive operator of finite trace is compact and hence never
    bounded away from zero.

review:
  status: "self-assessed"
  reviewers:
    - "none"
  notes: >-
    The statements of all definitions and results were checked and revised by the
    author; the proof scripts were largely produced with AI assistance and rest on
    the Lean kernel.

alignment:
  namespace: "Discretization"
  statements:
    - source: "Constructive discretization and approximation in RKHS, Theorem 3, finite second family"
      lean: "Discretization.bss_generalized"
      module: "Discretization.GeneralGram"
      status: "proved"
      note: >-
        The frame bounds with the lower one against the Gram matrix of the first
        family, for a finite second family, with no side condition beyond n ≥ m.
    - source: "Constructive discretization and approximation in RKHS, Corollary 4, finite second family"
      lean: "Discretization.exists_discretization"
      module: "Discretization.NormDiscretization"
      status: "proved"
      note: >-
        The same statement read through quadratic forms, for a normalized first
        family.
    - source: "Constructive discretization and approximation in RKHS, Theorem 3, countable second family"
      lean: "Discretization.Infinite.bss_generalized"
      module: "Discretization.Infinite.GeneralGram"
      status: "proved"
      note: >-
        For a second family with values in a separable Hilbert space; the upper frame
        bound is an inequality between operators, and the number of points is
        unchanged, being governed by the effective dimension M = ∫ ‖b‖² dμ / Λ.
    - source: "Constructive discretization and approximation in RKHS, Corollary 4, countable second family"
      lean: "Discretization.Infinite.exists_discretization"
      module: "Discretization.Infinite.NormDiscretization"
      status: "proved"
      note: >-
        A vector of the Hilbert space plays the role of the coefficient vector of the
        second family.

acknowledgements: >-
  Built on Mathlib. The Challenge module reproduces the definition Discretization.gram
  from the development in BasicResults/IntegralQuadraticForm.lean, so that the advertised
  statements can be read against Mathlib alone.
