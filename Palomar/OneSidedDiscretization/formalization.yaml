sources:
  - title: "Constructive discretization and approximation in reproducing kernel Hilbert spaces"
    authors:
      - "Abdellah Chkifa"
      - "Matthieu Dolbeault"
      - "David Krieg"
      - "Mario Ullrich"
    id: "arXiv:2602.18719"
    type: "paper"
    location: "https://arxiv.org/abs/2602.18719"
    relationship: "formalizes"
    note: >-
      Proposition 8 is formalized here: p = 2 by the discretization theorem with the
      constant function as second family and weights 1/n read off the construction for a
      small effective dimension, which is the proof of the source; and all 2 ≤ p ≤ ∞ at
      once, for bounded functions, by the one-sided discretization of the mixture of μ
      with the Kiefer–Wolfowitz measure and the interpolation
      ‖f‖_p ≤ ‖f‖_2^{2/p} ‖f‖_∞^{1−2/p}, as in the source.
    author_endorsement: "participated"
