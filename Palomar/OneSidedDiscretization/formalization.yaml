# formalization.yaml v0.4
version: "v0.4"

project:
  name: "One-sided discretization of L_p norms with equal weights"
  description: >-
    Let (Ω, μ) be a probability space and a = (aₖ) a family of m square-integrable
    functions with positive definite Gram matrix I = ∫ a a* dμ. Then for every n ≥ m there
    are points x₁, …, xₙ ∈ Ω, not necessarily distinct, with
    (1 − √((m−1)/n))² I ≼ (1/n) ∑ᵢ a(xᵢ) a(xᵢ)* in the Loewner order, that is
    (1 − √((m−1)/n))² ∫ |f|² dμ ≤ (1/n) ∑ᵢ |f(xᵢ)|² for every f in the span of the
    family. For bounded measurable functions there are n points with
    κ ‖f‖_p ≤ m^{1/2−1/p} ((2/n) ∑ᵢ |f(xᵢ)|²)^{1/2} for every 2 ≤ p ≤ ∞ at once, where
    κ = max(1 − √(m/n), 1/(2m)). This is Proposition 8 of Chkifa, Dolbeault, Krieg and
    Ullrich, with n points in place of 2n. Up to constants such bounds are due to Bartel,
    Schäfer and Ullrich, and to Limonova and Temlyakov under a Nikol'skii-type inequality.
  authors:
    - "Mario Ullrich"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Mario Ullrich"

classification:
  arxiv: ["math.NA", "math.FA"]
  msc2020: ["41A17", "46E30", "42C15"]

sources:
  - title: "Constructive discretization and approximation in reproducing kernel Hilbert spaces"
    authors:
      - "Abdellah Chkifa"
      - "Matthieu Dolbeault"
      - "David Krieg"
      - "Mario Ullrich"
    id: "arXiv:2602.18719"
    type: "paper"
    location: "https://arxiv.org/abs/2602.18719"
    relationship: "formalizes"
    note: >-
      Proposition 8 is formalized here: p = 2 with the proof of the paper, and
      2 ≤ p ≤ ∞ through the one-sided discretization of a mixture of μ with the
      Kiefer–Wolfowitz measure; see fidelity.divergences.
    author_endorsement: "participated"
  - title: "On sampling discretization in L₂"
    authors:
      - "Irina Limonova"
      - "Vladimir Temlyakov"
    id: "arXiv:2009.10789"
    type: "paper"
    location: "https://arxiv.org/abs/2009.10789"
    relationship: "background"
    note: >-
      J. Math. Anal. Appl. 515 (2022), no. 2, Paper No. 126457. Theorem 1.1, the bound
      with equal weights and of the order of m points, under a Nikol'skii-type inequality.
  - title: "Constructive subsampling of finite frames with applications in optimal function recovery"
    authors:
      - "Felix Bartel"
      - "Martin Schäfer"
      - "Tino Ullrich"
    type: "paper"
    location: "https://doi.org/10.1016/j.acha.2023.02.004"
    relationship: "background"
    note: >-
      Appl. Comput. Harmon. Anal. 65 (2023), 209–248. The bound with equal weights on
      arbitrary spaces, up to constants.
  - title: "Twice-Ramanujan sparsifiers"
    authors:
      - "Joshua Batson"
      - "Daniel A. Spielman"
      - "Nikhil Srivastava"
    id: "arXiv:0808.0163"
    type: "paper"
    location: "https://doi.org/10.1137/130949117"
    relationship: "background"
    note: >-
      SIAM Review 56 (2014), no. 2, 315–334. The potential-function argument, whose lower
      half is the construction here.
  - title: "The equivalence of two extremum problems"
    authors:
      - "Jack Kiefer"
      - "Jacob Wolfowitz"
    type: "paper"
    location: "https://doi.org/10.4153/CJM-1960-030-4"
    relationship: "background"
    note: >-
      Canad. J. Math. 12 (1960), 363–366. The source of the measure that dominates the
      uniform norm for p > 2.

related_formalizations:
  - id: "PALOMAR-2026-10-14-000002"
    relationship: "other"
    note: >-
      The sparsification theorem of Batson, Spielman and Srivastava, registered from the
      same repository. The construction here is the lower half of a similar potential
      argument, with equal weights 1/n on a probability space.

status:
  scope: >-
    Formalized and advertised: Discretization.bss_lower_equal_weights, the bound in the
    Loewner order, and Discretization.exists_one_sided_discretization, the same for the
    L₂ norm, both on a probability space for every n ≥ m; and
    Discretization.exists_lp_discretization, the bound for every 2 ≤ p ≤ ∞ with one set of
    n ≥ m points, for a bounded measurable family.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models:
        - "Claude Opus 5 (Anthropic)"
        - "Claude Fable 5.1 (Anthropic)"
      framework: "Claude Code"
      tool_setup: >-
        VS Code with the Lean 4 extension, and Claude Code driving an agentic loop
        that edits Lean files and runs `lake build` until the affected files compile.
        No proof search beyond the tactics of Lean and Mathlib.
      cost:
        wall_time: "not tracked"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: >-
        Standing instructions for this discretization project, kept in a CLAUDE.md
        file alongside the project and outside this repository, and applied to every
        session: prefer many small, self-contained, reusable lemmas over long proofs;
        search Mathlib first and reuse existing lemmas and canonical spellings;
        rebuild the affected files after every change and never leave a `sorry`
        unannounced.
  spend_usd: "subscription-based"
  notes: >-
    Most of the Lean proofs were produced with AI assistance. Throughout, the author
    designed the structure of the development and checked and revised the statements
    of all definitions and results. The proofs themselves are guaranteed by the Lean
    kernel.

fidelity:
  divergences: >-
    The source states (1 − √(m/n)) ‖f‖₂ ≤ ((1/n) ∑ᵢ |f(xᵢ)|²)^{1/2}, with 1/(2m) in place
    of 1 − √(m/n) for n = m. The formalization has the factor 1 − √((m−1)/n) of the
    source's proof, which exceeds both, and states squared norms.

    For 2 ≤ p ≤ ∞ the source takes n points for μ and n for the Kiefer–Wolfowitz measure,
    each with weight 1/n; the formalization takes n points for the mixture of the two
    measures, each with weight 2/n. The factor κ combines the source's two cases, and
    finite p are stated for p-th powers.

review:
  status: "self-assessed"
  reviewers:
    - "none"
  notes: >-
    The statements of all definitions and results were checked and revised by the
    author; the proof scripts were largely produced with AI assistance and rest on
    the Lean kernel.

alignment:
  namespace: "Discretization"
  statements:
    - source: "Constructive discretization and approximation in RKHS, Proposition 8, p = 2, in the Loewner order"
      lean: "Discretization.bss_lower_equal_weights"
      module: "Discretization.OneSidedDiscretization"
      status: "proved"
      note: "(1 − √((m−1)/n))² I ≼ (1/n) ∑ᵢ a(xᵢ) a(xᵢ)* on a probability space."
    - source: "Constructive discretization and approximation in RKHS, Proposition 8, p = 2"
      lean: "Discretization.exists_one_sided_discretization"
      module: "Discretization.OneSidedDiscretization"
      status: "proved"
      note: "The same for the L₂ norm of every f in the span."
    - source: "Constructive discretization and approximation in RKHS, Proposition 8, 2 ≤ p ≤ ∞"
      lean: "Discretization.exists_lp_discretization"
      module: "Discretization.LpDiscretization"
      status: "proved"
      note: >-
        One set of n points for every 2 ≤ p ≤ ∞, for a bounded measurable family; see
        fidelity.divergences.

acknowledgements: >-
  Built on Mathlib. The Challenge module reproduces the definition Discretization.gram
