# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4
version: "v0.4"

project:
  name: "The sparsification theorem of Batson, Spielman and Srivastava"
  description: >-
    Let v_y ∈ ℂᵐ, for y in a finite set Ω, be vectors with ∑_y v_y v_y* = I. Then for
    every n ≥ m there are weights s_y ≥ 0, at most n of them nonzero, with
    (1 − √((m−1)/n))² I ≼ ∑_y s_y v_y v_y* ≼ (1 + √((m−1)/n))² I
    in the Loewner order: a reweighted subset of at most n of the vectors is a spectral
    sparsifier of their sum. The original theorem of Batson, Spielman and Srivastava has
    the constants (1 ∓ √(m/n))², so for n = d·m the ratio of the upper to the lower
    constant, the condition number, is ((√d + 1)/(√d − 1))². With m − 1 in place of m,
    following Chkifa, Dolbeault, Krieg and Ullrich, the statement here is slightly
    stronger.
  authors:
    - "Mario Ullrich"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Mario Ullrich"

classification:
  arxiv: ["math.FA", "cs.DS"]
  msc2020: ["42C15", "15A45", "65F55", "05C50"]

sources:
  - title: "Twice-Ramanujan sparsifiers"
    authors:
      - "Joshua Batson"
      - "Daniel A. Spielman"
      - "Nikhil Srivastava"
    id: "arXiv:0808.0163"
    type: "article"
    location: "https://doi.org/10.1137/130949117"
    relationship: "formalizes"
    note: >-
      SIAM Review 56 (2014), no. 2, 315–334. The source states the theorem for a finite
      list of vectors summing to the identity and produces a reweighting supported on
      at most d·m of them, with frame constants (1 ∓ 1/√d)² = (1 ∓ √(m/n))². The
      formalized statement is that theorem for complex vectors, with m − 1 in place of
      m, following Chkifa, Dolbeault, Krieg and Ullrich; see fidelity.divergences.
  - title: "Constructive discretization and approximation in reproducing kernel Hilbert spaces"
    authors:
      - "Abdellah Chkifa"
      - "Matthieu Dolbeault"
      - "David Krieg"
      - "Mario Ullrich"
    id: "arXiv:2602.18719"
    type: "preprint"
    location: "https://arxiv.org/abs/2602.18719"
    relationship: "background"
    note: >-
      The proof followed, and the source of the constants √((m−1)/n) in place of
      √(m/n). The paper states the theorem over a measure space and for two families
      at once, with the upper bound in terms of the effective dimension of the second;
      that form is a separate submission (Palomar/Sparsification).
    author_endorsement: "participated"

related_formalizations: []

status:
  scope: >-
    Formalized and advertised: Discretization.bss_of_sum_eq_one, the two-sided
    bound for a reweighting of finitely many vectors summing to the identity, with at
    most n nonzero weights, for every n ≥ m and with no further hypothesis. It is
    derived in the repository from the same bound for a square-integrable family on an
    arbitrary measure space whose Gram matrix is the identity (Discretization.bss),
    applied to the counting measure.

    Not formalized: the graph-sparsification application of the source, and the
    algorithmic content, that is the running time of the construction. The proof is
    constructive in the sense that it selects the points one at a time, but no
    complexity statement is made.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models:
        - "Claude Opus 5 (Anthropic)"
        - "Claude Fable 5.1 (Anthropic)"
      framework: "Claude Code"
      tool_setup: >-
        VS Code with the Lean 4 extension, and Claude Code driving an agentic loop
        that edits Lean files and runs `lake build` until the affected files compile.
        No proof search beyond the tactics of Lean and Mathlib.
      cost:
        wall_time: "not tracked"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: >-
        Standing instructions for this discretization project, kept in a CLAUDE.md
        file alongside the project and outside this repository, and applied to every
        session: prefer many small, self-contained, reusable lemmas over long proofs;
        search Mathlib first and reuse existing lemmas and canonical spellings;
        rebuild the affected files after every change and never leave a `sorry`
        unannounced.
  spend_usd: "subscription-based"
  notes: >-
    Most of the Lean proofs were produced with AI assistance. Throughout, the author
    designed the structure of the development and checked and revised the statements
    of all definitions and results. The proofs themselves are guaranteed by the Lean
    kernel.

fidelity:
  divergences: >-
    The source works with real vectors; the formalized statement takes complex vectors
    v_y ∈ ℂᵐ and the Loewner order on complex matrices.
    The source bounds the number of nonzero weights by d·m for a real d > 1; the
    formalized statement takes any natural number n ≥ m instead, which is the same
    with n = d·m.

    The constants are (1 − √((m−1)/n))² and (1 + √((m−1)/n))², slightly better than
    the constants (1 ∓ √(m/n))² of the source. The improvement comes from the proof of
    Chkifa, Dolbeault, Krieg and Ullrich, which is the potential-function argument of
    the source in a refined form.

review:
  status: "self-assessed"
  reviewers:
    - "none"
  notes: >-
    The statements of all definitions and results were checked and revised by the
    author; the proof scripts were largely produced with AI assistance and rest on
    the Lean kernel.

alignment:
  namespace: "Discretization"
  statements:
    - source: "Twice-Ramanujan sparsifiers, the sparsification theorem"
      lean: "Discretization.bss_of_sum_eq_one"
      module: "Discretization.BSS"
      status: "proved"
      note: >-
        The two-sided bound for a reweighting of finitely many complex vectors summing
        to the identity; see fidelity.divergences.

acknowledgements: >-
  Built on Mathlib. The advertised statement uses only Mathlib's definitions, so the
  Challenge module restates none.
