# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4
version: "v0.4"

project:
  name: "The sparsification theorem of Batson, Spielman and Srivastava"
  description: >-
    Let (Ω, μ) be a measure space and a = (a_k) a family of m square-integrable functions
    whose Gram matrix ∫ a a* dμ is the identity. Then for every n ≥ m there are points
    x₁, …, xₙ ∈ Ω and weights w₁, …, wₙ > 0 with
    (1 − √((m−1)/n))² I ≼ ∑ᵢ wᵢ a(xᵢ) a(xᵢ)* ≼ (1 + √((m−1)/n))² I
    in the Loewner order. For the counting measure on a finite set Ω this is the theorem
    for finitely many vectors: if v_k ∈ ℂᵐ, k ∈ Ω, satisfy ∑_k v_k v_k* = I, then for every
    n ≥ m there are weights s_k ≥ 0, at most n of them nonzero, with
    (1 − √((m−1)/n))² I ≼ ∑_k s_k v_k v_k* ≼ (1 + √((m−1)/n))² I,
    so a reweighted subset of at most n of the vectors is a spectral sparsifier of their
    sum. The original theorem of Batson, Spielman and Srivastava has the constants
    (1 ∓ √(m/n))²; with m − 1 in place of m, following Chkifa, Dolbeault, Krieg and
    Ullrich, the statements here are slightly stronger.
  authors:
    - "Mario Ullrich"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Mario Ullrich"

classification:
  arxiv: ["math.FA", "cs.DS"]
  msc2020: ["42C15", "15A45", "65F55", "05C50"]

sources:
  - title: "Twice-Ramanujan sparsifiers"
    authors:
      - "Joshua Batson"
      - "Daniel A. Spielman"
      - "Nikhil Srivastava"
    id: "arXiv:0808.0163"
    type: "paper"
    location: "https://doi.org/10.1137/130949117"
    relationship: "formalizes"
    note: >-
      SIAM Review 56 (2014), no. 2, 315–334. Theorem 3.1 states the theorem for a finite
      list of vectors summing to the identity and produces a reweighting supported on at
      most d·m of them, with frame constants (1 ∓ 1/√d)² = (1 ∓ √(m/n))². It is formalized
      for complex vectors, with m − 1 in place of m; see fidelity.divergences. Its
      potential-function argument underlies both statements.
  - title: "Constructive discretization and approximation in reproducing kernel Hilbert spaces"
    authors:
      - "Abdellah Chkifa"
      - "Matthieu Dolbeault"
      - "David Krieg"
      - "Mario Ullrich"
    id: "arXiv:2602.18719"
    type: "paper"
    location: "https://arxiv.org/abs/2602.18719"
    relationship: "formalizes"
    note: >-
      Theorem 3 with b = a and Gram matrix the identity is the measure-space statement
      formalized here: then J = I and the effective dimension M equals m, so both frame
      bounds carry the constants (1 ∓ √((m−1)/n))², for every n ≥ m on an arbitrary
      measure space. Its proof is the one followed. The step from finitely many vectors
      to a measure space is the choice of each new point. Batson, Spielman and
      Srivastava sum the lower and upper verifiers over all vectors; here they are
      integrated against μ, and since ∫ a a* dμ = I the integrals obey the same trace
      bounds as the sums, so the admissible points form a set of positive measure. The
      remaining steps are linear algebra on m × m matrices. For the counting measure on a
      finite set the integrals are the sums of the original proof.
    author_endorsement: "participated"

related_formalizations: []

status:
  scope: >-
    Formalized and advertised: Discretization.bss, the two-sided bound for a family of m
    square-integrable functions on an arbitrary measure space whose Gram matrix is the
    identity, with n points and positive weights; and Discretization.bss_of_sum_eq_one,
    the two-sided bound for a reweighting of finitely many vectors summing to the
    identity, with at most n nonzero weights. Both hold for every n ≥ m with no further
    hypothesis.

    Not formalized: the graph-sparsification application of Batson, Spielman and
    Srivastava, and the algorithmic content, that is the running time of the
    construction. The proof is constructive in the sense that it selects the points one
    at a time, but no complexity statement is made.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models:
        - "Claude Opus 5 (Anthropic)"
        - "Claude Fable 5.1 (Anthropic)"
      framework: "Claude Code"
      tool_setup: >-
        VS Code with the Lean 4 extension, and Claude Code driving an agentic loop
        that edits Lean files and runs `lake build` until the affected files compile.
        No proof search beyond the tactics of Lean and Mathlib.
      cost:
        wall_time: "not tracked"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: >-
        Standing instructions for this discretization project, kept in a CLAUDE.md
        file alongside the project and outside this repository, and applied to every
        session: prefer many small, self-contained, reusable lemmas over long proofs;
        search Mathlib first and reuse existing lemmas and canonical spellings;
        rebuild the affected files after every change and never leave a `sorry`
        unannounced.
  spend_usd: "subscription-based"
  notes: >-
    Most of the Lean proofs were produced with AI assistance. Throughout, the author
    designed the structure of the development and checked and revised the statements
    of all definitions and results. The proofs themselves are guaranteed by the Lean
    kernel.

fidelity:
  divergences: >-
    Batson, Spielman and Srivastava work with real vectors; the formalized statements
    take complex vectors v_k ∈ ℂᵐ, respectively a complex-valued family, and the Loewner
    order on complex matrices, as Chkifa, Dolbeault, Krieg and Ullrich do. The
    measure-space form is Theorem 3 of Chkifa, Dolbeault, Krieg and Ullrich for b = a;
    the finitely many vectors of Batson, Spielman and Srivastava are its case of the
    counting measure on a finite set (Discretization.bss_of_sum_eq_one).

    Batson, Spielman and Srivastava bound the number of nonzero weights by d·m for a
    real d > 1; the formalized statements take any natural number n ≥ m instead, which
    is the same with n = d·m.

    The constants are (1 − √((m−1)/n))² and (1 + √((m−1)/n))², slightly better than
    the constants (1 ∓ √(m/n))² of Batson, Spielman and Srivastava. They are the
    constants of Theorem 3 of Chkifa, Dolbeault, Krieg and Ullrich, whose proof is the
    potential-function argument in a refined form.

review:
  status: "self-assessed"
  reviewers:
    - "none"
  notes: >-
    The statements of all definitions and results were checked and revised by the
    author; the proof scripts were largely produced with AI assistance and rest on
    the Lean kernel.

alignment:
  namespace: "Discretization"
  statements:
    - source: "Constructive discretization and approximation in RKHS, Theorem 3, for b = a with Gram matrix the identity"
      lean: "Discretization.bss"
      module: "Discretization.BSS"
      status: "proved"
      note: >-
        The two-sided bound for a family of m square-integrable functions on a measure
        space whose Gram matrix is the identity, with n points and positive weights.
    - source: "Twice-Ramanujan sparsifiers, Theorem 3.1"
      lean: "Discretization.bss_of_sum_eq_one"
      module: "Discretization.BSS"
      status: "proved"
      note: >-
        The two-sided bound for a reweighting of finitely many complex vectors summing
        to the identity; see fidelity.divergences.

