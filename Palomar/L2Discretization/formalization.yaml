# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4
version: "v0.4"

project:
  name: "A discretization theorem of Batson, Spielman and Srivastava type"
  description: >-
    Given a measure space, a finite family a = (aₖ) of m square-integrable functions and a
    square-integrable map b into a separable Hilbert space, one can select n points and
    positive weights, for every n ≥ m, so that the first family stays a frame from below
    and b stays a frame from above, with the constants (1 − √((m−1)/n))² and
    (1 + √((M−1)/n))² Λ. Here Λ bounds the Gram operator J = ∫ b(x) b(x)* dμ(x) and
    M = ∫ ‖b‖² dμ / Λ is its effective dimension. What the number of points depends on
    is M, not the dimension of the space, which is what makes the theorem applicable to
    infinite families and to reproducing kernel Hilbert spaces, and why its constants
    beat those obtainable from the theorem of Kadison and Singer. For a = b with Gram
    matrix the identity, M equals m and the statement is the sparsification theorem of
    Batson, Spielman and Srivastava with m − 1 in place of m. Formalized as an inequality
    between matrices, or operators, in the Loewner order and as a discretization
    inequality for the L₂ norm; the second family is a finite family or a
    square-integrable map into a separable Hilbert space, and the L₂ inequality is stated
    for a reproducing kernel Hilbert space H with M = ∫ K(x, x) dμ / Λ:
    (1 − √((m−1)/n))² ∫ |f|² dμ ≤ ∑ᵢ wᵢ |f(xᵢ)|² for f in the span of a, and
    ∑ᵢ wᵢ |g(xᵢ)|² ≤ (1 + √((M−1)/n))² Λ ‖g‖²_H for g ∈ H. There is no side condition
    beyond n ≥ m.
  authors:
    - "Mario Ullrich"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Mario Ullrich"

