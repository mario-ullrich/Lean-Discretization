# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4
version: "v0.4"

project:
  name: "A discretization theorem of Batson, Spielman and Srivastava type"
  description: >-
    Let (Ω, μ) be a measure space, a = (aₖ) a family of m square-integrable functions with
    positive definite Gram matrix I = ∫ a a* dμ, and b a square-integrable map into a
    separable Hilbert space whose Gram operator J = ∫ b b* dμ is injective and bounded by
    Λ. With the effective dimension M = ∫ ‖b‖² dμ / Λ, for every n ≥ m there are points
    x₁, …, xₙ ∈ Ω and weights wᵢ > 0 with
    (1 − √((m−1)/n))² I ≼ ∑ᵢ wᵢ a(xᵢ) a(xᵢ)* and ∑ᵢ wᵢ b(xᵢ) b(xᵢ)* ≼ (1 + √((M−1)/n))² Λ
    in the Loewner order. The number of points depends on M, not on the dimension of the
    Hilbert space. For a reproducing kernel Hilbert space H, with M = ∫ K(x, x) dμ / Λ,
    this is a discretization of the L₂ norm:
    (1 − √((m−1)/n))² ∫ |f|² dμ ≤ ∑ᵢ wᵢ |f(xᵢ)|² for f in the span of a, and
    ∑ᵢ wᵢ |g(xᵢ)|² ≤ (1 + √((M−1)/n))² Λ ‖g‖²_H for g ∈ H.
    Both forms are also formalized for a finite second family. The theorem generalizes the
    sparsification theorem of Batson, Spielman and Srivastava, the case b = a with I the
    identity.
  authors:
    - "Mario Ullrich"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Mario Ullrich"

