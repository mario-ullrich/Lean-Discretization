related_formalizations: []

status:
  scope: >-
    Formalized and advertised: Discretization.bss_generalized and
    Discretization.Infinite.bss_generalized, the frame bounds for a finite second family
    and for a map into a separable Hilbert space; Discretization.exists_discretization,
    the discretization inequality for finite families; and
    Discretization.RKHS.exists_discretization, the discretization of the L₂-norm from
    below and of the norm of a reproducing kernel Hilbert space from above. None of the
    four carries a side condition beyond n ≥ m.

    Proved in the repository but not advertised here: the bound
    ∑ᵢ wᵢ |⟨u, b(xᵢ)⟩|² ≤ (1 + √((M−1)/n))² Λ ‖u‖² for a general map b
    (Discretization.Infinite.exists_discretization); the theorem for a countable family
    (bₖ) with its Gram matrix, in the indexing of the source and with nothing assumed
    pointwise (Discretization.Countable.bss_generalized); and the potential argument under the
    two side conditions m ≥ 2 and M ≥ 1 + 1/n (bss_generalized_of_gram_eq_one) with the
    three edge cases that remove them (bss_generalized_of_unique,
    bss_generalized_of_small_dim, bss_generalized_of_unique_of_small_dim), each proved
    once for matrices and operators (Discretization.UpperBarrier).

    Not formalized: sampling projections, least-squares recovery and sampling numbers.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

