status:
  scope: >-
    Formalized and advertised: Discretization.bss_generalized and
    Discretization.Infinite.bss_generalized, the frame bounds for a finite second family
    and for a map into a separable Hilbert space; Discretization.exists_discretization and
    Discretization.RKHS.exists_discretization, the discretization inequalities for finite
    families and for a reproducing kernel Hilbert space. All four hold for every n ≥ m.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models:
        - "Claude Opus 5 (Anthropic)"
        - "Claude Fable 5.1 (Anthropic)"
      framework: "Claude Code"
      tool_setup: >-
        VS Code with the Lean 4 extension, and Claude Code driving an agentic loop
        that edits Lean files and runs `lake build` until the affected files compile.
        No proof search beyond the tactics of Lean and Mathlib.
      cost:
        wall_time: "not tracked"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: >-
        Standing instructions for this discretization project, kept in a CLAUDE.md
        file alongside the project and outside this repository, and applied to every
        session: prefer many small, self-contained, reusable lemmas over long proofs;
        search Mathlib first and reuse existing lemmas and canonical spellings;
        rebuild the affected files after every change and never leave a `sorry`
        unannounced.
  spend_usd: "subscription-based"
  notes: >-
    Most of the Lean proofs were produced with AI assistance. Throughout, the author
    designed the structure of the development and checked and revised the statements
    of all definitions and results. The proofs themselves are guaranteed by the Lean
    kernel.

fidelity:
  divergences: >-
    The source states the lower frame bound as (1 − √((m−1)/n))² λ_min(I); the
    formalization states the Loewner inequality (1 − √((m−1)/n))² I ≼ ∑ᵢ wᵢ a(xᵢ) a(xᵢ)*,
    from which it follows. J is bounded by any Λ > 0 where the source takes λ_max(J).

    For an infinite second family the source takes a countable family (bₖ); the
    formalization takes a map b into a separable Hilbert space with the Bochner integral
    J = ∫ b b* dμ as Gram operator, and (bₖ) is the case H = ℓ²
    (Discretization.Countable.bss_generalized). Injectivity of J takes the place of
    positive definiteness: J has finite trace, so it is compact and not bounded below.

review:
  status: "self-assessed"
  reviewers:
    - "none"
  notes: >-
    The statements of all definitions and results were checked and revised by the
    author; the proof scripts were largely produced with AI assistance and rest on
    the Lean kernel.

alignment:
  namespace: "Discretization"
  statements:
    - source: "Constructive discretization and approximation in RKHS, Theorem 3, finite second family"
      lean: "Discretization.bss_generalized"
      module: "Discretization.GeneralGram"
      status: "proved"
      note: "The frame bounds for a finite second family, with M = Tr J / Λ."
    - source: "Constructive discretization and approximation in RKHS, Corollary 4, finite second family"
      lean: "Discretization.exists_discretization"
      module: "Discretization.NormDiscretization"
      status: "proved"
      note: >-
        The same read through quadratic forms; the upper bound uses the coefficient norm
        of g.
    - source: "Constructive discretization and approximation in RKHS, Theorem 3"
      lean: "Discretization.Infinite.bss_generalized"
      module: "Discretization.Infinite.GeneralGram"
      status: "proved"
      note: >-
        The frame bounds for b with values in a separable Hilbert space, the upper one
        between operators.
    - source: "Constructive discretization and approximation in RKHS, Corollary 4"
      lean: "Discretization.RKHS.exists_discretization"
      module: "Discretization.Infinite.RKHS"
      status: "proved"
      note: >-
        The L₂ norm on the span of a from below and the norm of H from above, with
        M = ∫ K(x, x) dμ / Λ.

acknowledgements: >-
  Built on Mathlib. The Challenge module reproduces the definitions Discretization.gram,
  Discretization.RKHS.evalCLM and Discretization.RKHS.kernelSection from the
  development, so that the advertised statements can be read against Mathlib alone.
